    Properties:
      FunctionName: mvc-resorts
      Runtime: nodejs20.x
      Handler: src/handlers/resorts.handler
      Code:
        S3Bucket: mvc-portfolio-web
        S3Key: !Ref LambdaS3Key
      Role: !GetAtt LambdaRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          DB_CLUSTER_ARN: !ImportValue MvcDbClusterArn
