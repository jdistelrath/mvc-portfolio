AWSTemplateFormatVersion: '2010-09-09'
Description: MVC Portfolio API — API Gateway + Lambda (no SAM)

Parameters:
  LambdaS3Key:
    Type: String
    Default: deploy/lambda.zip
  DefaultAccountId:
    Type: String
    Default: '00000000-0000-0000-0000-000000000001'

Resources:
  # IAM Role for all Lambda functions
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mvc-portfolio-lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: rds-data-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - rds-data:ExecuteStatement
                  - rds-data:BatchExecuteStatement
                Resource: !ImportValue MvcDbClusterArn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !ImportValue MvcDbSecretArn

  # Lambda Functions
  AccountFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: mvc-account
      Runtime: nodejs20.x
      Handler: src/handlers/account.handler
      Code:
        S3Bucket: mvc-portfolio-web
        S3Key: !Ref LambdaS3Key
      Role: !GetAtt LambdaRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          DB_CLUSTER_ARN: !ImportValue MvcDbClusterArn
          DB_SECRET_ARN: !ImportValue MvcDbSecretArn
          DB_NAME: !ImportValue MvcDbName
          DEFAULT_ACCOUNT_ID: !Ref DefaultAccountId

  ContractsFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: mvc-contracts
      Runtime: nodejs20.x
      Handler: src/handlers/contracts.handler
      Code:
        S3Bucket: mvc-portfolio-web
        S3Key: !Ref LambdaS3Key
      Role: !GetAtt LambdaRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          DB_CLUSTER_ARN: !ImportValue MvcDbClusterArn
          DB_SECRET_ARN: !ImportValue MvcDbSecretArn
          DB_NAME: !ImportValue MvcDbName
          DEFAULT_ACCOUNT_ID: !Ref DefaultAccountId

  TripsFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: mvc-trips
      Runtime: nodejs20.x
      Handler: src/handlers/trips.handler
      Code:
        S3Bucket: mvc-portfolio-web
        S3Key: !Ref LambdaS3Key
      Role: !GetAtt LambdaRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          DB_CLUSTER_ARN: !ImportValue MvcDbClusterArn
          DB_SECRET_ARN: !ImportValue MvcDbSecretArn
          DB_NAME: !ImportValue MvcDbName
          DEFAULT_ACCOUNT_ID: !Ref DefaultAccountId

  BalancesFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: mvc-balances
      Runtime: nodejs20.x
      Handler: src/handlers/balances.handler
      Code:
        S3Bucket: mvc-portfolio-web
        S3Key: !Ref LambdaS3Key
      Role: !GetAtt LambdaRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          DB_CLUSTER_ARN: !ImportValue MvcDbClusterArn
          DB_SECRET_ARN: !ImportValue MvcDbSecretArn
          DB_NAME: !ImportValue MvcDbName
          DEFAULT_ACCOUNT_ID: !Ref DefaultAccountId

  AllocationsFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: mvc-allocations
      Runtime: nodejs20.x
      Handler: src/handlers/allocations.handler
      Code:
        S3Bucket: mvc-portfolio-web
        S3Key: !Ref LambdaS3Key
      Role: !GetAtt LambdaRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          DB_CLUSTER_ARN: !ImportValue MvcDbClusterArn
          DB_SECRET_ARN: !ImportValue MvcDbSecretArn
          DB_NAME: !ImportValue MvcDbName
          DEFAULT_ACCOUNT_ID: !Ref DefaultAccountId

  FeesFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: mvc-fees
      Runtime: nodejs20.x
      Handler: src/handlers/fees.handler
      Code:
        S3Bucket: mvc-portfolio-web
