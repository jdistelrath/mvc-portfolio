name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reject deprecated Node runtimes in infrastructure
        run: |
          if grep -REn --include='*.yaml' 'nodejs16\.x|nodejs18\.x|nodejs20\.x' infrastructure/; then
            echo 'Deprecated Node runtime reference found in infrastructure/'
            exit 1
          fi

      - run: npm ci
      - run: npm run build
        env:
          BUILD_TARGET: aws
          VITE_API_URL: ${{ vars.API_URL }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Sync to S3
        run: aws s3 sync dist/ s3://${{ vars.S3_BUCKET || 'mvc-portfolio-web' }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_DISTRIBUTION_ID }} \
            --paths "/*"
